services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: wechat-local-test
      MYSQL_DATABASE: wechat_test
    ports:
      - '127.0.0.1:33367:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:36379:6379'
